name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request's branch cancels the run before it. A push
# to main is never cancelled: its run saves the caches pull requests restore.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  # One toolchain for every job, so a new stable release does not change the
  # lints under a pull request. The workspace's rust-version is the minimum.
  RUST_TOOLCHAIN: 1.98.1
  # The hub version `hgl-ai server install` pins; the bus tests run against it.
  NATS_VERSION: 2.15.3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      # Built dependencies a run on main saved for this toolchain and lock file.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &lint-cache-paths |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Only main saves, and only a new key; the workspace's own crates are
      # rebuilt by every run and are left out.
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *lint-cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      # The pinned release, checked against its SHA256SUMS, on PATH: the live
      # bus tests skip themselves without it.
      - name: Install nats-server
        shell: bash
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) arch=linux-amd64 ;;
            Linux-ARM64) arch=linux-arm64 ;;
            macOS-ARM64) arch=darwin-arm64 ;;
            macOS-X64) arch=darwin-amd64 ;;
            *) echo "::error::no nats-server build for $RUNNER_OS $RUNNER_ARCH"; exit 1 ;;
          esac
          name="nats-server-v${NATS_VERSION}-${arch}"
          base="https://github.com/nats-io/nats-server/releases/download/v${NATS_VERSION}"
          dir="$RUNNER_TEMP/nats"
          mkdir -p "$dir/bin"
          curl -fsSL --retry 3 -o "$dir/$name.tar.gz" "$base/$name.tar.gz"
          curl -fsSL --retry 3 -o "$dir/SHA256SUMS" "$base/SHA256SUMS"
          (cd "$dir" && grep " $name.tar.gz\$" SHA256SUMS > want && shasum -a 256 -c want)
          tar -xzf "$dir/$name.tar.gz" -C "$dir"
          mv "$dir/$name/nats-server" "$dir/bin/nats-server"
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/nats-server" --version
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &test-cache-paths |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-
      # The tests that go over a memory cap on purpose run here, not in a plain local run.
      - run: cargo test --workspace --locked
        env:
          HGL_AI_OOM_TESTS: "1"
          TMPDIR: ${{ runner.temp }}
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        run: cargo clean --workspace
      - if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *test-cache-paths
          key: ${{ steps.cache.outputs.cache-primary-key }}
