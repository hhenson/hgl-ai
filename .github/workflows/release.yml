name: Release

on:
  push:
    # A release's tag is `v` and the workspace version: `v0.1.0`.
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_TOOLCHAIN: 1.98.1
  TAP_REPO: hhenson/homebrew-hgraph

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          want=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hgl-ai") | .version')
          if [[ "$GITHUB_REF_NAME" != "v$want" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $want (expected v$want)"
            exit 1
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          # GitHub's arm64 Linux runner (free for public repositories): a
          # native build, so the musl C toolchain of the image serves `ring`.
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-26
          # Apple's toolchain on the arm64 runner builds Intel binaries too.
          - target: x86_64-apple-darwin
            os: macos-26
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      # `musl-gcc` from musl-tools for the C in the dependency tree.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked -p hgl-ai --target "$TARGET"
      - name: Check the binary
        shell: bash
        run: |
          bin="target/$TARGET/release/hgl-ai"
          if [[ "$RUNNER_OS" == Linux ]]; then
            file "$bin"
            file "$bin" | grep -Eq 'statically linked|static-pie linked' || { echo "::error::$bin is not static"; exit 1; }
          else
            # Ad hoc signature: arm64 macOS runs no unsigned code.
            codesign --force --sign - "$bin"
            want=x86_64
            [[ "$TARGET" == aarch64-* ]] && want=arm64
            [[ "$(lipo -archs "$bin")" == "$want" ]] || { echo "::error::$bin is not built for $TARGET"; exit 1; }
          fi
          if [[ "$TARGET" != x86_64-apple-darwin ]]; then
            "$bin" --version | grep -qx "hgl-ai $VERSION" || { echo "::error::$bin --version is not hgl-ai $VERSION"; exit 1; }
          fi
      - name: Package
        shell: bash
        run: |
          name="hgl-ai-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/hgl-ai" LICENSE README.md "dist/$name/"
          cd dist
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz"; else shasum -a 256 "$name.tar.gz"; fi > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hgl-ai-${{ matrix.target }}
          path: |
            dist/hgl-ai-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz
            dist/hgl-ai-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hgl-ai-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/dist"
          ls -l
          [[ $(ls hgl-ai-"$VERSION"-*.tar.gz | wc -l) == 4 ]] || { echo "::error::expected four archives"; exit 1; }
          sha256sum -c hgl-ai-"$VERSION"-*.tar.gz.sha256
          if [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME no longer points to $GITHUB_SHA"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "hgl-ai $VERSION" --generate-notes hgl-ai-"$VERSION"-*

  tap:
    needs: [version, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # A fine-grained token with contents and pull requests (read and write)
      # on the tap repository; GitHub's own token cannot reach another repository.
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Check the tap token
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "::error::The repository secret TAP_TOKEN is not set. Add a token with contents and pull-requests write access to $TAP_REPO, then re-run this job; the release itself is published."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hgl-ai-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      # The formula comes from the binary this run built, and the checksums
      # of the archives the release now holds.
      - name: Render the formula
        run: |
          cd "$RUNNER_TEMP/dist"
          tar -xzf "hgl-ai-$VERSION-x86_64-unknown-linux-musl.tar.gz"
          "./hgl-ai-$VERSION-x86_64-unknown-linux-musl/hgl-ai" gh tap formula \
            --version "$VERSION" --checksums . --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/hgl-ai.rb"
          cat "$RUNNER_TEMP/hgl-ai.rb"
      - name: Open the tap pull request
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          branch="codex/hgl-ai-$VERSION"
          file=Formula/hgl-ai.rb
          if ! gh api "repos/$TAP_REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            main=$(gh api "repos/$TAP_REPO/git/ref/heads/main" --jq .object.sha)
            gh api -X POST "repos/$TAP_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$main" >/dev/null
          fi
          old=$(gh api "repos/$TAP_REPO/contents/$file?ref=$branch" --jq .sha 2>/dev/null || true)
          args=(-f message="hgl-ai $VERSION" -f content="$(base64 -w0 "$RUNNER_TEMP/hgl-ai.rb")" -f branch="$branch")
          [[ -n "$old" ]] && args+=(-f sha="$old")
          gh api -X PUT "repos/$TAP_REPO/contents/$file" "${args[@]}" >/dev/null
          if [[ -z "$(gh pr list --repo "$TAP_REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')" ]]; then
            body="\`Formula/hgl-ai.rb\` for [hgl-ai $VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME): the four archives' URLs and checksums, rendered by \`hgl-ai gh tap formula\` in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            gh pr create --repo "$TAP_REPO" --base main --head "$branch" --title "hgl-ai $VERSION" --body "$body"
          fi
