[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hgl-ai"
version = "0.2.0"
description = "NATS JetStream multi-host, multi-model coordination bus and worker bridge for HGL agents"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Howard Henson" },
]
requires-python = ">=3.11"
dependencies = [
    "nats-py>=2.9.0",
]

[project.urls]
Repository = "https://github.com/hhenson/hgl-ai"
Issues = "https://github.com/hhenson/hgl-ai/issues"

[project.scripts]
hgl-ctl = "hgl_ai.cli:main"
hgl-mcp = "hgl_ai.mcp_server:main"
hgl-bridge = "hgl_ai.worker_bridge:main"

[tool.setuptools.packages.find]
where = ["src"]
